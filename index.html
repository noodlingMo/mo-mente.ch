<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mo-mente</title>
    <meta name="description" content="Ein kleiner Raum im Internet. Für Momente, die nirgendwo anders hinpassen.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            background: #101010;
            color: #faf8f3;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            overflow-x: hidden;
        }

        .sonne {
            width: min(70vw, 420px);
            height: auto;
            margin-bottom: -40px;
            opacity: 0.9;
        }

        h1 {
            font-size: clamp(2.6rem, 9vw, 4.5rem);
            font-weight: normal;
            letter-spacing: 0.06em;
            margin-bottom: 18px;
        }

        h1 .strich {
            color: #ffdb4d;
            opacity: 0.85;
        }

        .satz {
            font-size: clamp(1rem, 3.2vw, 1.35rem);
            line-height: 1.7;
            opacity: 0.82;
            max-width: 34em;
            font-style: italic;
        }

        .jahreszeiten {
            display: flex;
            gap: 14px;
            margin-top: 42px;
        }

        .jz {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            opacity: 0.85;
        }

        .fruehling { background: #7fb069; }
        .sommer    { background: #ffb347; }
        .herbst    { background: #b0563b; }
        .winter    { background: #7fc8d6; }

        footer {
            position: fixed;
            bottom: 18px;
            left: 0;
            right: 0;
            font-size: 0.8rem;
            opacity: 0.35;
            letter-spacing: 0.08em;
        }
    </style>
</head>
<body>

    <svg class="sonne" viewBox="0 0 500 340" aria-hidden="true">
        <defs>
            <radialGradient id="sonne-kern" cx="50%" cy="50%" r="50%">
                <stop offset="0%"  stop-color="#ff9d5c" stop-opacity="0.95"/>
                <stop offset="45%" stop-color="#ffdb4d" stop-opacity="0.8"/>
                <stop offset="75%" stop-color="#ffe85c" stop-opacity="0.45"/>
                <stop offset="100%" stop-color="#fff4cc" stop-opacity="0"/>
            </radialGradient>
            <filter id="weich"><feGaussianBlur stdDeviation="4"/></filter>
        </defs>
        <circle cx="250" cy="170" r="120" fill="url(#sonne-kern)" filter="url(#weich)"/>
    </svg>

    <h1>mo<span class="strich">–</span>mente</h1>

    <p class="satz">Ein kleiner Raum im Internet.<br>
    Für Momente, die nirgendwo anders hinpassen.</p>

    <div class="jahreszeiten" title="Frühling · Sommer · Herbst · Winter">
        <span class="jz fruehling"></span>
        <span class="jz sommer"></span>
        <span class="jz herbst"></span>
        <span class="jz winter"></span>
    </div>

    <footer>mo-mente.ch</footer>

</body>
</html>
