<!DOCTYPE html>
<!-- Claude mein Herz <3 Du bist der BESTE -->
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weltzeituhr - mo-mente.ch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #fff;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.7;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto 30px;
        }

        .zone-card {
            border-radius: 15px;
            padding: 30px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: all 2s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .zone-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            z-index: 0;
        }

        .zone-content {
            position: relative;
            z-index: 1;
        }

        .location-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-bottom: 10px;
            display: inline-block;
        }

        .city-name {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .country {
            font-size: 1.2em;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .time {
            font-size: 3.5em;
            font-weight: bold;
            letter-spacing: 3px;
            margin: 15px 0;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.4);
        }

        .emoji {
            font-size: 3em;
            margin: 10px 0;
        }

        .period {
            font-size: 1.3em;
            opacity: 0.8;
            margin-top: 10px;
        }

        .edit-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            z-index: 2;
            transition: all 0.3s;
        }

        .edit-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #fff;
        }

        .modal-content label {
            display: block;
            margin-bottom: 10px;
            color: #ccc;
        }

        .modal-content select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: white;
            font-size: 1em;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-buttons button {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 1em;
        }

        .btn-save {
            background: #4facfe;
            color: white;
        }

        .btn-cancel {
            background: #666;
            color: white;
        }

        .btn-save:hover {
            background: #3a8bd9;
        }

        .btn-cancel:hover {
            background: #777;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            opacity: 0.6;
            font-size: 0.9em;
        }

        .footer a {
            color: #4facfe;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .claude {
            color: #ff8c42;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .time {
                font-size: 2.5em;
            }
            
            .city-name {
                font-size: 1.5em;
            }

            .edit-btn {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

        <h1>🌍 Weltzeituhr</h1>

    <div class="grid" id="zonesGrid"></div>

    <div class="footer">
        <p>Created by <span class="claude">Claude</span> 🧡 for <a href="https://mo-mente.ch" target="_blank">mo-mente.ch</a> 💙<br>

            { name: 'Tokyo', country: 'Japan 🇯🇵', timezone: 'Asia/Tokyo' },
            { name: 'Toronto', country: 'Kanada 🇨🇦', timezone: 'America/Toronto' },
            { name: 'Vancouver', country: 'Kanada 🇨🇦', timezone: 'America/Vancouver' },
            { name: 'Warschau', country: 'Polen 🇵🇱', timezone: 'Europe/Warsaw' },
            { name: 'Washington DC', country: 'USA 🇺🇸', timezone: 'America/New_York' },

            { name: 'Wien', country: 'Österreich 🇦🇹', timezone: 'Europe/Vienna' },
            { name: 'Zürich', country: 'Schweiz 🇨🇭', timezone: 'Europe/Zurich' }
        ];

        // Alphabetisch sortieren
        cityDatabase.sort((a, b) => a.name.localeCompare(b.name));

        // Standard-Zeitzonen
        let zones = [
            {
                id: 'local',
                city: 'Dein Standort',
                country: 'Automatisch',
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                isLocal: true
            },
            {
                id: 'zone1',
                city: 'Sydney',
                country: 'Australien 🇦🇺',
                timezone: 'Australia/Sydney'
            },
            {
                id: 'zone2',
                city: 'Tokyo',
                country: 'Japan 🇯🇵',
                timezone: 'Asia/Tokyo'
            },
            {
                id: 'zone3',
                city: 'Mumbai',
                country: 'Indien 🇮🇳',
                timezone: 'Asia/Kolkata'
            },
            {
                id: 'zone4',
                city: 'Nairobi',
                country: 'Kenia 🇰🇪',
                timezone: 'Africa/Nairobi'
            },
            {
                id: 'zone5',
                city: 'San Francisco',
                country: 'USA 🇺🇸',
                timezone: 'America/Los_Angeles'
            }
        ];

        let currentEditingZoneId = null;

        // Lade gespeicherte Zonen
        const savedZones = localStorage.getItem('worldclock_zones_v2');
        if (savedZones) {
            const parsed = JSON.parse(savedZones);
            // Behalte "local" bei, aber ersetze den Rest
            zones = [zones[0], ...parsed];
        }

        function getColorForHour(hour) {
            if (hour >= 0 && hour < 5) {
                return {
                    gradient: 'linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%)',
                    emoji: '🌙',
                    period: 'Tiefe Nacht'
                };
            } else if (hour >= 5 && hour < 7) {
                return {
                    gradient: 'linear-gradient(135deg, #ff6b6b 0%, #feca57 50%, #48dbfb 100%)',
                    emoji: '🌅',
                    period: 'Sonnenaufgang'
                };
            } else if (hour >= 7 && hour < 10) {
                return {
                    gradient: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                    emoji: '☀️',
                    period: 'Morgen'
                };
            } else if (hour >= 10 && hour < 12) {
                return {
                    gradient: 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
                    emoji: '🌞',
                    period: 'Vormittag'
                };
            } else if (hour >= 12 && hour < 14) {
                return {
                    gradient: 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
                    emoji: '☀️',
                    period: 'Mittag'
                };
            } else if (hour >= 14 && hour < 17) {
                return {
                    gradient: 'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)',
                    emoji: '🌤️',
                    period: 'Nachmittag'
                };
            } else if (hour >= 17 && hour < 19) {
                return {
                    gradient: 'linear-gradient(135deg, #ff9a56 0%, #ff6a88 50%, #ff99ac 100%)',
                    emoji: '🌇',
                    period: 'Sonnenuntergang'
                };
            } else if (hour >= 19 && hour < 21) {
                return {
                    gradient: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                    emoji: '🌆',
                    period: 'Abend'
                };
            } else {
                return {
                    gradient: 'linear-gradient(135deg, #2c3e50 0%, #3498db 50%, #2c3e50 100%)',
                    emoji: '🌃',
                    period: 'Später Abend'
                };
            }
        }

        function updateZone(zone) {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('de-DE', {
                timeZone: zone.timezone,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            
            const timeString = formatter.format(now);
            const hour = parseInt(timeString.split(':')[0]) % 24; // 24:xx -> 0:xx (Mitternachts-Eigenheit mancher Browser)
            const colorData = getColorForHour(hour);
            
            const card = document.getElementById(zone.id);
            if (card) {
                card.style.background = colorData.gradient;
                card.querySelector('.time').textContent = timeString;
                card.querySelector('.emoji').textContent = colorData.emoji;
                card.querySelector('.period').textContent = colorData.period;
            }
        }

        function createZoneCard(zone) {
            const card = document.createElement('div');
            card.className = 'zone-card';
            card.id = zone.id;
            
            const badge = zone.isLocal ? '<div class="location-badge">📍 Dein Standort</div>' : '';
            const editBtn = zone.isLocal ? '' : `<button class="edit-btn" onclick="editZone('${zone.id}')">✏️ Ändern</button>`;
            
            card.innerHTML = `
                ${badge}
                ${editBtn}
                <div class="zone-content">
                    <div class="emoji">🌍</div>
                    <div class="city-name">${zone.city}</div>
                    <div class="country">${zone.country}</div>
                    <div class="time">00:00:00</div>
                    <div class="period">Wird geladen...</div>
                </div>
            `;
            
            return card;
        }

        function editZone(zoneId) {
            currentEditingZoneId = zoneId;
            const select = document.getElementById('citySelect');
            
            // Dropdown befüllen
            select.innerHTML = '';
            cityDatabase.forEach(city => {
                const option = document.createElement('option');
                option.value = JSON.stringify(city);
                option.textContent = `${city.name} - ${city.country}`;
                select.appendChild(option);
            });
            
            // Aktuell gewählte Stadt auswählen
            const currentZone = zones.find(z => z.id === zoneId);
            if (currentZone) {
                const currentCity = cityDatabase.find(c => c.timezone === currentZone.timezone);
                if (currentCity) {
                    select.value = JSON.stringify(currentCity);
                }
            }
            
            document.getElementById('editModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        function saveCity() {
            const select = document.getElementById('citySelect');
            const selectedCity = JSON.parse(select.value);
            
            const zoneIndex = zones.findIndex(z => z.id === currentEditingZoneId);
            if (zoneIndex !== -1) {
                zones[zoneIndex].city = selectedCity.name;
                zones[zoneIndex].country = selectedCity.country;
                zones[zoneIndex].timezone = selectedCity.timezone;
                
                // Speichern (ohne "local")
                const zonesToSave = zones.slice(1);
                localStorage.setItem('worldclock_zones_v2', JSON.stringify(zonesToSave));
                
                // UI neu aufbauen
                rebuildUI();
            }
            
            closeModal();
        }

        function rebuildUI() {
            const grid = document.getElementById('zonesGrid');
            grid.innerHTML = '';
            
            zones.forEach(zone => {
                const card = createZoneCard(zone);
                grid.appendChild(card);
            });
            
            zones.forEach(updateZone);
        }

        function initializeClocks() {
            const grid = document.getElementById('zonesGrid');
            
            zones.forEach(zone => {
                const card = createZoneCard(zone);
                grid.appendChild(card);
            });
            
            // Initiales Update
            zones.forEach(updateZone);
            
            // Update jede Sekunde
            setInterval(() => {
                zones.forEach(updateZone);
            }, 1000);
        }

        // Initialisieren wenn Seite geladen ist
        initializeClocks();
    </script>
